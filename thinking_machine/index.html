<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <title>Posture Detection</title> <style>body{margin:0;padding:0;font-family:'Inter',sans-serif;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;background:#111;color:white}header{padding:1rem;font-size:1.5rem;font-weight:600;text-align:center;color:white}#main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:1rem;box-sizing:border-box;gap:2rem}#video-wrapper{display:flex;flex-direction:column;align-items:center;gap:.5rem}#status-label{font-size:1.3rem;font-weight:600;text-align:center;min-height:1.5rem;transition:color .3s ease}#canvas{max-width:65vw;max-height:70vh;border-radius:12px;background:black;box-shadow:0 0 25px 6px rgba(0,0,0,0.6);flex-shrink:0;transition:box-shadow .3s ease}.glow-good{box-shadow:0 0 40px 12px rgba(40,167,69,0.9)}.glow-bad{box-shadow:0 0 40px 12px rgba(220,53,69,0.9)}.bar-wrapper{display:flex;flex-direction:column;align-items:center;width:70px;transition:box-shadow .3s ease}.bar-label{font-size:1rem;font-weight:500;margin-bottom:.3rem;text-align:center}.bar-container{width:100%;height:350px;background:rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;display:flex;flex-direction:column-reverse}.bar{width:100%;height:0;transition:height .3s ease}.good{background:#28a745}.bad{background:#dc3545}.percent{margin-top:.5rem;font-size:.9rem;color:#ccc}#controls{padding:1rem;display:flex;justify-content:center;width:100%}button{padding:10px 20px;border:0;border-radius:8px;background:#007bff;color:white;font-size:1rem;font-weight:500;cursor:pointer;transition:background .2s ease}button:hover{background:#0056b3}</style> </head> <body> <header>📏 Posture Detection</header> <div id="main"> <div id="good-wrapper" class="bar-wrapper"> <div class="bar-label">Good</div> <div class="bar-container"><div id="good-bar" class="bar good"></div></div> <div id="good-percent" class="percent">0%</div> </div> <div id="video-wrapper"> <div id="status-label">Analyzing...</div> <canvas id="canvas"></canvas> </div> <div id="bad-wrapper" class="bar-wrapper"> <div class="bar-label">Bad</div> <div class="bar-container"><div id="bad-bar" class="bar bad"></div></div> <div id="bad-percent" class="percent">0%</div> </div> </div> <div id="controls"> <button id="toggle-btn" onclick="toggle()">Start</button> </div> <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script> <script type="text/javascript">async function init(){const e=URL+"model.json",t=URL+"metadata.json";model=await tmPose.load(e,t),maxPredictions=model.getTotalClasses();const n=document.getElementById("canvas");ctx=n.getContext("2d"),n.width=640,n.height=480;const o=!0;webcam=new tmPose.Webcam(n.width,n.height,o),await webcam.setup(),await webcam.play(),running=!0,window.requestAnimationFrame(loop)}async function loop(){running&&(webcam.update(),await predict()),window.requestAnimationFrame(loop)}async function predict(){const{pose:e,posenetOutput:t}=await model.estimatePose(webcam.canvas),n=await model.predict(t);let o=0,a=0;for(let e=0;e<maxPredictions;e++)n[e].className.toLowerCase().includes("good")&&(o=n[e].probability),n[e].className.toLowerCase().includes("bad")&&(a=n[e].probability);document.getElementById("good-bar").style.height=100*o+"%",document.getElementById("bad-bar").style.height=100*a+"%",document.getElementById("good-percent").innerText=Math.round(100*o)+"%",document.getElementById("bad-percent").innerText=Math.round(100*a)+"%";const s=document.getElementById("canvas"),i=document.getElementById("status-label");if(s.classList.remove("glow-good","glow-bad"),o>.7?(i.innerText="\u2705 Good Posture",i.style.color="#28a745",s.classList.add("glow-good")):a>.7?(i.innerText="\u26a0\ufe0f Bad Posture",i.style.color="#dc3545",s.classList.add("glow-bad")):(i.innerText="Analyzing...",i.style.color="#ccc"),ctx.drawImage(webcam.canvas,0,0,canvas.width,canvas.height),e){const t=.5;tmPose.drawKeypoints(e.keypoints,t,ctx),tmPose.drawSkeleton(e.keypoints,t,ctx)}}function toggle(){const e=document.getElementById("toggle-btn");model?(running=!running,e.innerText=running?"Pause":"Resume"):(init(),e.innerText="Pause")}const URL="https://teachablemachine.withgoogle.com/models/VXTs5iAEA/";let model,webcam,ctx,maxPredictions,running=!1;</script> </body> </html>
